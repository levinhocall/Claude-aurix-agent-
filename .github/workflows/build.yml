name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Surface errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Execution failed|FAILED|Unresolved|AssertionError" -A2 build.log | cut -c1-300 | head -n 70 | awk 'BEGIN{ORS="%0A"} {print}' > errs.txt
          echo "::error title=Gradle errors::$(cat errs.txt)"
      - uses: actions/upload-artifact@v4
        with:
          name: aurix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
