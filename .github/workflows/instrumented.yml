name: Instrumented tests (emulator)
# Manual run: gradle connectedDebugAndroidTest on an API 30 x86_64 emulator (SQLCipher + recovery tests).
on: [workflow_dispatch]
jobs:
  connected:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: gradle connectedDebugAndroidTest --no-daemon --stacktrace > gradle-instrumented.log 2>&1
      - name: Surface failures as annotations
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET
          def esc(t): return t.replace('%','%25').replace('\r','').replace('\n','%0A')[:3500]
          found = False
          for f in glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for bad in list(tc.findall('failure')) + list(tc.findall('error')):
                      found = True
                      print('::error title=%s.%s::%s' % (tc.get('classname'), tc.get('name'), esc(bad.text or bad.get('message') or '')))
          try:
              log = open('gradle-instrumented.log', errors='replace').read()
              m = re.search(r'(\* What went wrong:.*?)(\* Try:|\Z)', log, re.S)
              if m: print('::error title=gradle::' + esc(m.group(1)))
              elif not found: print('::error title=gradle-tail::' + esc(log[-3000:]))
          except FileNotFoundError:
              print('::error title=gradle::no log (emulator did not start)')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests/
